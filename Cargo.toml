[package]
name = "protonet"
version = "0.1.0"
edition = "2021"
description = "Native Windows True-P2P Threat Network with BLAKE3 Signature Flagging"
authors = ["Antigravity & User"]

[dependencies]
eframe = "0.27"
egui = "0.27"
egui_extras = "0.27"
image = { version = "0.24", default-features = false, features = ["png"] }
tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
futures = "0.3"
blake3 = "1.5"
chacha20poly1305 = "0.10"
rand = "0.8"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
parking_lot = "0.12"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
