version: 2
updates:
  # Maintain dependencies for the main starchild / protonet crate
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major breaking UI framework versions require coordinated manual migration
      - dependency-name: "egui"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "egui_extras"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for the fuzzing harness
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "fuzz"
    groups:
      fuzz-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
