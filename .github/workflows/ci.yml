name: security-and-p2p

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Security audit (workspace & fuzz)
        shell: pwsh
        run: |
          $auditFailed = $false
          Write-Host "Auditing workspace root Cargo.lock..."
          cargo audit
          if ($LASTEXITCODE -ne 0) { $auditFailed = $true }

          Write-Host "Auditing fuzz/Cargo.lock..."
          cargo audit --file fuzz/Cargo.lock
          if ($LASTEXITCODE -ne 0) { $auditFailed = $true }

          if ($auditFailed) {
            Write-Error "cargo audit found vulnerabilities."
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ⚠️ Security Audit Failure`n`nA vulnerability was detected in the locked dependencies. Check if running ``cargo update`` or Dependabot PRs resolve it, or verify if an advisory ignore is needed in ``.cargo/audit.toml``."
            }
            exit 1
          }
